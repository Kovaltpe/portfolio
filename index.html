<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111211" />
    <meta name="description" content="Andrey Lozov is a freelance frontend and backend developer based in Alicante, Spain, building thoughtful websites for businesses." />
    <title>Andrey Lozov &mdash; Freelance Full-Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const themeColor = (theme) =>
          theme === "light" ? "#f6f3eb" : "#111211";

        try {
          const theme =
            window.localStorage.getItem("andrey-theme") === "light"
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", themeColor(theme));
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
